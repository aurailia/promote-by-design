<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>She Promotes Promo Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0b;
    --side: #050505;
    --surface: #151515;
    --surface-2: #1c1c1c;
    --line: #2b2a27;
    --ink: #f3efe8;
    --muted: #a8a299;
    --lav: #c3a9ff;
    --lav-deep: #7d5fd0;
    --lav-soft: rgba(195,169,255,.12);
    --grad: linear-gradient(135deg, #b89bff 0%, #d9a2e6 50%, #f29bbd 100%);
    --grad-soft: linear-gradient(135deg, rgba(184,155,255,.18), rgba(242,155,189,.14));
    --gold: #d6ad57;
    --gold-soft: rgba(214,173,87,.12);
    --pink: #ee97b4;
    --pink-soft: rgba(238,151,180,.1);
    --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
  body { overscroll-behavior-y: none; }
  body { margin: 0; background: radial-gradient(700px 420px at 92% 6%, rgba(214,173,87,.10), transparent 65%), radial-gradient(1200px 600px at 70% -10%, rgba(184,155,255,.12), transparent 60%), radial-gradient(900px 500px at 0% 100%, rgba(242,155,189,.08), transparent 60%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: var(--ui); font-size: 17px; line-height: 1.65; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--lav); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Layout */
  .app { display: flex; align-items: flex-start; min-height: 100vh; max-width: 1120px; margin: 0 auto; }
  @media (min-width: 861px) { .side { border-left: 1px solid rgba(195,169,255,.22); } }
  .side {
    position: sticky; top: 0; height: 100vh; width: 280px; flex: 0 0 280px; overflow-y: auto;
    padding: 28px 18px 32px; background: linear-gradient(180deg, #0c0812 0%, #07050a 60%, #110a12 100%); border-right: 1px solid rgba(195,169,255,.22);
  }
  .brand { font-family: var(--display); font-size: 29px; font-weight: 600; line-height: 1.05; color: var(--ink); }
  .brand span { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; font-style: italic; }
  .brand-sub { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-top: 6px; }
  .nav { display: flex; flex-direction: column; gap: 6px; margin-top: 26px; }
  .navitem {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 12px;
    padding: 11px 12px; font-size: 16px; font-weight: 500; color: var(--muted);
  }
  .navitem:hover { background: rgba(255,255,255,.05); color: var(--ink); }
  .navitem .gl { color: var(--gold); font-size: 14px; }
  .navitem[aria-current="page"] { background: var(--grad-soft); border-color: rgba(195,169,255,.45); color: #fff; font-weight: 600; }
  .navitem .soon { margin-left: auto; font-size: 12px; color: var(--pink); font-weight: 600; }
  .side-note { margin-top: 26px; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .main { flex: 1; min-width: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 38px 24px 90px; }
  .topbar { display: none; }
  .scrim { display: none; }

  @media (max-width: 860px) {
    .side { position: fixed; left: 0; top: 0; bottom: 0; height: auto; z-index: 40; width: min(300px, 86vw); transform: translateX(-104%); transition: transform .25s ease; box-shadow: 8px 0 30px rgba(0,0,0,.6); padding-top: calc(26px + env(safe-area-inset-top, 0px)); }
    body.nav-open .side { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; }
    body.nav-open .scrim { opacity: 1; pointer-events: auto; }
    .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; background: rgba(5,5,5,.94); border-bottom: 1px solid rgba(195,169,255,.22); padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
    .menu-btn { background: var(--grad); color: #140d1c; border: none; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 15px; }
    .toplabel { color: var(--ink); font-family: var(--display); font-size: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wrap { padding: 24px 16px 80px; }
  }

  /* Type */
  .eyebrow { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin: 0 0 8px; }
  h1 { font-family: var(--display); font-size: 47px; font-weight: 600; line-height: 1.05; margin: 0; color: var(--ink); }
  h1 em { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; padding-right: 4px; }
  .lede { color: var(--muted); margin: 14px 0 0; max-width: 60ch; font-size: 18px; }

  /* Cards */
  .card { background: linear-gradient(180deg, #171419, #121113); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; margin-top: 18px; }
  .card h3 { width: fit-content; max-width: 100%; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; font-family: var(--display); font-size: 28px; font-weight: 600; margin: 0 0 6px; line-height: 1.15; }
  .card .lead { color: var(--gold); font-weight: 600; font-size: 15px; margin: 0 0 10px; }
  .card h4 { font-size: 16px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--pink); margin: 24px 0 8px; }
  .card p { margin: 0 0 10px; }
  .card p:last-child { margin-bottom: 0; }
  .hint { color: var(--muted); font-size: 15px; }
  .stars { list-style: none; margin: 6px 0 10px; padding: 0; }
  .stars li { padding-left: 24px; position: relative; margin-bottom: 8px; }
  .stars li::before { content: "\2726"; position: absolute; left: 0; color: var(--gold); }
  .quote { margin: 12px 0 0; padding: 10px 14px; border-left: 3px solid var(--pink); background: var(--pink-soft); border-radius: 0 12px 12px 0; font-style: italic; color: var(--ink); }
  .sub { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 14px; background: var(--surface-2); }
  .sub .t { font-weight: 600; color: var(--lav); }
  .sub .what { color: var(--pink); font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 10px 0 2px; }
  .callout { background: var(--grad-soft); border: 1px solid rgba(195,169,255,.4); border-radius: 16px; padding: 16px 18px; margin-top: 18px; }
  .callout strong { color: var(--lav); }
  .where { margin-top: 10px; font-size: 15px; color: var(--muted); }
  .where strong { color: var(--lav); font-weight: 600; }

  /* Steps */
  .steps { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: s; }
  .steps li { counter-increment: s; position: relative; padding: 12px 0 12px 48px; border-top: 1px solid var(--line); }
  .steps li:first-child { border-top: none; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--lav); color: var(--lav); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; }
  .steps .st { font-weight: 600; color: var(--lav); display: block; }

  /* Chips and buttons */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 14px; font-size: 15px; color: var(--ink); }
  .chip:hover { border-color: var(--lav); }
  .chip[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: #140d1c; font-weight: 600; }
  .grp-label { font-weight: 600; font-size: 15px; color: var(--lav); margin: 14px 0 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 11px 20px; font-size: 16px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); text-decoration: none; }
  .btn:hover { border-color: var(--lav); }
  .btn.main { background: var(--grad); border-color: transparent; color: #140d1c; box-shadow: 0 6px 20px rgba(184,155,255,.25); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

  .soon-card { text-align: center; padding: 40px 20px; }
  .soon-card .glyph { color: var(--gold); font-size: 31px; }
  .signoff { text-align: center; margin-top: 34px; font-family: var(--display); font-size: 22px; color: var(--pink); }
  .signoff .sig { color: var(--gold); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--grad); color: #140d1c; font-weight: 600; padding: 10px 18px; border-radius: 999px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }


  /* Forms */
  .field { margin-top: 18px; }
  .field:first-of-type { margin-top: 8px; }
  .field label { display: block; font-weight: 600; color: var(--ink); font-size: 16px; }
  .field .help { color: var(--muted); font-size: 15px; margin: 2px 0 8px; }
  .field .ex { color: var(--pink); font-size: 14px; font-style: italic; margin: 6px 0 0; }
  .input, .textarea, .select { width: 100%; background: #fdfbff; border: 1px solid #d9cdea; border-radius: 12px; padding: 11px 13px; color: #1d1a22; color-scheme: light; caret-color: #7d5fd0; font-size: 17px; line-height: 1.5; -webkit-appearance: none; appearance: none; }
  .textarea { min-height: 96px; resize: vertical; }
  .textarea.post { min-height: 220px; }
  .select { background-image: linear-gradient(45deg, transparent 50%, #7d5fd0 50%), linear-gradient(135deg, #7d5fd0 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  .input:focus, .textarea:focus, .select:focus { outline: none; border-color: #9b7be6; box-shadow: 0 0 0 3px rgba(195,169,255,.45); }
  .input::placeholder, .textarea::placeholder { color: #9a93a3; }
  .input[readonly], .textarea[readonly] { background: #f4f0f8; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
  .offer { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 16px; background: #141216; }
  .offer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .offer-head .t { font-weight: 600; color: var(--lav); }
  .btn.small { padding: 7px 14px; font-size: 14px; }
  .btn.warn { border-color: rgba(242,155,189,.6); color: var(--pink); }
  .saved-note { font-size: 14px; color: var(--muted); margin-top: 10px; }

  /* Week */
  .progress { height: 8px; border-radius: 999px; background: #1f1c22; overflow: hidden; margin-top: 10px; }
  .progress span { display: block; height: 100%; background: var(--grad); border-radius: 999px; }
  details.day { background: linear-gradient(180deg, #171419, #121113); border: 1px solid var(--line); border-radius: 18px; margin-top: 14px; overflow: hidden; }
  details.day > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; align-items: center; gap: 12px; }
  details.day > summary::-webkit-details-marker { display: none; }
  details.day > summary .dname { font-family: var(--display); font-size: 25px; font-weight: 600; color: var(--ink); line-height: 1.1; }
  details.day > summary .ddate { color: var(--muted); font-size: 15px; }
  details.day > summary .dcount { margin-left: auto; font-size: 14px; color: var(--lav); font-weight: 600; white-space: nowrap; }
  details.day > summary .chev { color: var(--lav); transition: transform .2s; }
  details.day[open] > summary .chev { transform: rotate(90deg); }
  .day-body { padding: 0 18px 18px; }
  .day-note { font-size: 15px; color: var(--muted); background: var(--lav-soft); border-radius: 12px; padding: 10px 12px; margin-top: 4px; }
  .day-note strong { color: var(--lav); }
  .slot { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; background: #0f0e11; }
  .slot.posted { border-color: rgba(195,169,255,.55); }
  .slot-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
  .slot-where { font-weight: 600; color: var(--ink); }
  .pill { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--lav-soft); color: var(--lav); }
  .pill.done { background: var(--grad); color: #140d1c; }
  .slot .mini { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin: 14px 0 6px; }
  .imgbox { margin-top: 6px; }
  .imgbox img { display: block; max-width: 100%; max-height: 360px; border-radius: 12px; border: 1px solid var(--line); }
  .filebtn { position: relative; overflow: hidden; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
  .rest-note { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .grp { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; background: #141216; }
  .grp-top { display: flex; gap: 10px; align-items: center; }
  .grp-top .input { flex: 1; }


  /* Speak */
  .lab-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mic { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; border: 1px solid rgba(195,169,255,.45); background: transparent; color: var(--lav); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
  .mic svg { width: 15px; height: 15px; }
  .mic:hover { background: var(--lav-soft); }
  .mic.on { background: var(--grad); color: #140d1c; border-color: transparent; animation: micpulse 1.4s ease-in-out infinite; }
  @keyframes micpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,155,189,.5); } 50% { box-shadow: 0 0 0 7px rgba(242,155,189,0); } }
  .textarea.listening, .input.listening { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(242,155,189,.18); }
  .speak-tip { display: flex; gap: 10px; align-items: flex-start; background: var(--grad-soft); border: 1px solid rgba(195,169,255,.35); border-radius: 14px; padding: 12px 14px; margin-top: 18px; font-size: 15px; color: var(--ink); }
  .speak-tip svg { width: 18px; height: 18px; color: var(--lav); flex: 0 0 auto; margin-top: 2px; }


  /* Days and results */
  .subnav { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 6px 22px; padding-left: 10px; border-left: 1px solid rgba(195,169,255,.22); }
  .navwrap { position: relative; }
  .navitem.has-toggle { padding-right: 44px; }
  .navtoggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: var(--lav); font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
  .navtoggle:hover { background: rgba(255,255,255,.08); }
  .navtoggle.open { transform: translateY(-50%) rotate(90deg); }
  .navitem.dayitem { padding: 7px 10px; font-size: 14px; border-radius: 10px; }
  .navitem.dayitem .ok { margin-left: auto; color: var(--lav); font-weight: 600; font-size: 13px; }
  .navitem.dayitem.off { opacity: .55; }
  .daygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
  .daycard { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: linear-gradient(180deg, #171419, #121113); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; color: var(--ink); }
  .daycard:hover { border-color: var(--lav); }
  .daycard.today { border-color: rgba(195,169,255,.6); }
  .daycard.done { background: var(--grad-soft); border-color: rgba(195,169,255,.5); }
  .daycard.off { opacity: .55; }
  .dc-name { font-family: var(--display); font-size: 23px; font-weight: 600; line-height: 1.1; }
  .dc-date { color: var(--muted); font-size: 14px; }
  .dc-status { margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--lav); }
  .back { color: var(--gold); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .share { display: flex; flex-wrap: wrap; gap: 8px; }
  .sharebtn { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 600; text-decoration: none; background: var(--grad); color: #140d1c; }
  .sharebtn .arr { font-size: 13px; }
  .sharebtn.nolink { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  .complete-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding: 16px 18px; border-radius: 16px; border: 1px solid rgba(195,169,255,.4); background: var(--grad-soft); }
  .complete-bar .hint { margin: 0; color: var(--ink); }
  .daynav { justify-content: space-between; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
  .stat { background: var(--grad-soft); border: 1px solid rgba(195,169,255,.35); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; }
  .stat .sv { font-family: var(--display); font-size: 35px; font-weight: 600; line-height: 1.1; color: var(--ink); }
  .stat-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .statedit > summary { list-style: none; cursor: pointer; color: var(--lav); font-size: 14px; font-weight: 600; border: 1px solid rgba(195,169,255,.45); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  .statedit > summary::-webkit-details-marker { display: none; }
  .statedit[open] { flex-basis: 100%; }
  .stat-head:has(.statedit[open]) { flex-wrap: wrap; }
  .statedit[open] > summary { display: inline-block; margin-bottom: 8px; }
  .mrow { display: grid; grid-template-columns: 1fr 160px; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .mrow:first-child { border-top: none; }
  .mlab { display: flex; flex-direction: column; }
  .mn { font-weight: 600; }
  .mi { font-size: 14px; color: var(--muted); }
  .mi.up { color: var(--lav); font-weight: 600; }
  @media (max-width: 480px) { .mrow { grid-template-columns: 1fr 120px; } }
  .guide-tabs { margin: 18px 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 4px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .tab { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; }
  .tab[aria-selected="true"] { background: var(--grad); color: #140d1c; border-color: transparent; }
  .count { font-size: 13px; color: var(--muted); align-self: center; }
  .count.over { color: var(--pink); font-weight: 600; }
  .btn.star.on { border-color: rgba(214,173,87,.6); color: var(--gold); }
  .libtxt { display: flex; flex-direction: column; min-width: 0; }
  .libtxt .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .libtxt .tk { align-self: flex-start; margin-top: 4px; }
  .imgrow { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line); }
  .imgrow:first-child { border-top: none; }
  .imgtext { min-width: 0; flex: 1; }
  .imgtext .hint { margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .imgtext .actions { margin-top: 8px; }
  .imgcell { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .imgcell img { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
  .explain { background: rgba(195,169,255,.08); border: 1px solid rgba(195,169,255,.25); border-left: 3px solid var(--lav); border-radius: 0 12px 12px 0; padding: 12px 14px; margin: 6px 0 14px; }
  .explain .xl { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--lav); margin-bottom: 4px; }
  .explain p { margin: 0; color: #e4dcec; }
  .trow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .trow:first-child { border-top: none; }
  .trow .tn { font-weight: 600; margin-right: 8px; }
  .trow .tk { font-size: 13px; color: var(--lav); background: var(--lav-soft); border-radius: 999px; padding: 2px 8px; }
  .stat .sl { color: var(--muted); font-size: 14px; }
  .histrow { display: flex; flex-direction: column; padding: 12px 0; border-top: 1px solid var(--line); }
  .histrow:first-child { border-top: none; }
  .histrow .hw { font-weight: 600; color: var(--lav); }
  .histrow .hd { font-size: 15px; }
  .histrow .hn { font-size: 14px; color: var(--muted); font-style: italic; margin-top: 2px; }

  /* Gold bodygraph */
  .main { position: relative; }
  .wrap { position: relative; z-index: 1; }
  .mark { position: absolute; top: 30px; right: 0; width: min(420px, 62vw); opacity: .07; pointer-events: none; z-index: 0; }
  .mark svg { width: 100%; height: auto; display: block; }
  body.on-start .mark { display: none; }
  .hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr 230px; gap: 12px; align-items: center; border-radius: 22px; padding: 30px 26px; border: 1px solid rgba(214,173,87,.3);
    background: radial-gradient(circle at 80% 45%, rgba(214,173,87,.24), transparent 52%), radial-gradient(circle at 10% 115%, rgba(184,155,255,.2), transparent 60%), linear-gradient(160deg, #151117, #0a090b); }
  .hero-text { position: relative; z-index: 1; }
  .hero h1 { font-size: 47px; }
  .hero .lede { color: #cfc8d4; }
  .hero-art svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 14px rgba(214,173,87,.35)); animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; padding: 26px 20px; }
    .hero-art { position: absolute; right: -36px; top: -6px; width: 200px; opacity: .32; }
    .hero h1 { font-size: 39px; }
  }
  @media (prefers-reduced-motion: reduce) { .hero-art svg { animation: none; } }

  /* Background art */
  body { background: #0a080c; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, rgba(9,7,11,.80), rgba(9,7,11,.90)), var(--bgimg) 72% center / cover no-repeat; }
  .mark { display: none; }
  .side { background: linear-gradient(180deg, rgba(12,8,16,.92) 0%, rgba(7,5,10,.94) 60%, rgba(16,10,18,.94) 100%); }
  .emblem { display: block; width: 84px; height: 84px; margin: 0 0 12px -6px; filter: drop-shadow(0 0 12px rgba(214,173,87,.35)); }
  .hero { display: block; min-height: 300px; grid-template-columns: none;
    background: linear-gradient(90deg, rgba(10,8,12,.94) 0%, rgba(10,8,12,.80) 42%, rgba(10,8,12,.18) 78%, rgba(10,8,12,.05) 100%), var(--bgimg) right center / cover no-repeat; }
  .hero-text { max-width: 470px; }
  @media (max-width: 640px) {
    .hero { min-height: 0; background: linear-gradient(180deg, rgba(10,8,12,.55) 0%, rgba(10,8,12,.88) 55%, rgba(10,8,12,.95) 100%), var(--bgimg) 85% top / cover no-repeat; }
  }
  @media (max-width: 480px) {
    h1 { font-size: 39px; }
    .card { padding: 20px 16px; }
    .card h3 { font-size: 25px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  var KEY = 'shePromotesPromoPlanner';

  /* ---------- state ---------- */
  function blankBusiness() { return { you: '', name: '', what: '', who: '', problem: '', change: '', offers: [blankOffer()], community: { name: '', link: '', what: '', draws: '', items: [] }, story: '', proof: '', vibe: [], words: '', avoid: '', look: '', website: '', about: '', best: '', admire: '', admireWhy: '', moments: '' }; }
  function blankOffer() { return { name: '', what: '', format: '', price: '', link: '' }; }
  function blankWeek() { return { start: defaultMonday(), focus: 'rotate', rest: [], groups: [], slots: {}, done: [], platforms: [] }; }
  function blankResults() { return { values: {}, notes: '' }; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(dt) { return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
  function defaultMonday() {
    var now = new Date(); var dow = (now.getDay() + 6) % 7;
    var mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
    if (dow > 2) mon = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 7);
    return ymd(mon);
  }
  var state = { view: 'start', design: { type: '', authority: '', profile: '', open: [], channels: [], motors: [], gates: [], done: false }, business: blankBusiness(), week: blankWeek(), results: { stats: [], dismissed: [], current: blankResults(), history: [] }, library: [] };
  try {
    var raw = window.localStorage.getItem(KEY);
    if (raw) {
      var saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        if (saved.design && typeof saved.design === 'object') {
          var d0 = state.design;
          ['type', 'authority', 'profile'].forEach(function (k) { if (typeof saved.design[k] === 'string') d0[k] = saved.design[k]; });
          ['open', 'channels', 'motors', 'gates'].forEach(function (k) { if (Array.isArray(saved.design[k])) d0[k] = saved.design[k]; });
          d0.done = !!saved.design.done;
        }
        if (saved.business && typeof saved.business === 'object') {
          var b0 = state.business, sb = saved.business;
          ['you', 'name', 'what', 'who', 'problem', 'change', 'moments', 'story', 'proof', 'words', 'avoid', 'look', 'website', 'about', 'best', 'admire', 'admireWhy'].forEach(function (k) { if (typeof sb[k] === 'string') b0[k] = sb[k]; });
          if (Array.isArray(sb.vibe)) b0.vibe = sb.vibe.filter(function (v) { return typeof v === 'string'; });
          if (Array.isArray(sb.offers) && sb.offers.length) b0.offers = sb.offers.slice(0, 3).map(function (o) { var n = blankOffer(); if (o && typeof o === 'object') Object.keys(n).forEach(function (k) { if (typeof o[k] === 'string') n[k] = o[k]; }); return n; });
          if (sb.community && typeof sb.community === 'object') if (sb.community && Array.isArray(sb.community.items)) b0.community.items = sb.community.items.filter(function (x) { return x && typeof x === 'object'; }).slice(0, 6).map(function (x) { return { name: String(x.name || ''), what: String(x.what || ''), helps: String(x.helps || '') }; });
          if (sb.community && typeof sb.community === 'object') ['name', 'link', 'what', 'draws'].forEach(function (k) { if (typeof sb.community[k] === 'string') b0.community[k] = sb.community[k]; });
        }
        if (saved.week && typeof saved.week === 'object') {
          var w0 = state.week, sw = saved.week;
          if (typeof sw.start === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(sw.start)) w0.start = sw.start;
          if (typeof sw.focus === 'string') w0.focus = sw.focus;
          if (Array.isArray(sw.platforms)) w0.platforms = sw.platforms.filter(function (x) { return x === 'instagram' || x === 'facebook' || x === 'tiktok'; });
          if (Array.isArray(sw.done)) w0.done = sw.done.filter(function (n) { return typeof n === 'number'; });
          if (Array.isArray(sw.rest)) w0.rest = sw.rest.filter(function (n) { return typeof n === 'number'; });
          if (Array.isArray(sw.groups)) w0.groups = sw.groups.filter(function (g) { return g && typeof g.id === 'string'; }).map(function (g) { return { id: g.id, name: typeof g.name === 'string' ? g.name : '', url: typeof g.url === 'string' ? g.url : '', days: Array.isArray(g.days) ? g.days.filter(function (n) { return typeof n === 'number'; }) : [] }; });
          if (sw.slots && typeof sw.slots === 'object') Object.keys(sw.slots).forEach(function (k) {
            var x = sw.slots[k]; if (!x || typeof x !== 'object' || k.indexOf('-g') > -1) return;
            w0.slots[k] = { offer: typeof x.offer === 'string' ? x.offer : '', text: typeof x.text === 'string' ? x.text : '', title: typeof x.title === 'string' ? x.title : '', draw: typeof x.draw === 'string' ? x.draw : '', ig: typeof x.ig === 'string' ? x.ig : '', fb: typeof x.fb === 'string' ? x.fb : '', tt: typeof x.tt === 'string' ? x.tt : '', imgPrompt: typeof x.imgPrompt === 'string' ? x.imgPrompt : '', img: typeof x.img === 'string' ? x.img : '', posted: !!x.posted };
          });
        }
        if (saved.results && typeof saved.results === 'object') {
          var sr = saved.results, R0 = state.results;
          var cleanMetric = function (m) { return { id: String(m.id), name: String(m.name || 'Number'), kind: m.kind === 'money' ? 'money' : 'count', mode: m.mode === 'week' ? 'week' : 'total' }; };
          if (Array.isArray(sr.stats)) R0.stats = sr.stats.filter(function (st) { return st && typeof st.name === 'string' && Array.isArray(st.metrics); }).map(function (st) {
            return { id: String(st.id || ''), name: st.name, metrics: st.metrics.filter(function (m) { return m && m.id; }).map(cleanMetric) };
          });
          else if (Array.isArray(sr.trackers)) R0.stats = sr.trackers.filter(function (t) { return t && t.id && typeof t.name === 'string'; }).map(function (t) {
            return { id: 's' + t.id, name: t.name, metrics: [{ id: t.id, name: t.kind === 'money' ? 'Money in this week' : 'This week', kind: t.kind === 'money' ? 'money' : 'count', mode: 'week' }] };
          });
          if (Array.isArray(sr.dismissed)) R0.dismissed = sr.dismissed.filter(function (x) { return typeof x === 'string'; });
          if (sr.current && typeof sr.current === 'object') {
            if (sr.current.values && typeof sr.current.values === 'object') Object.keys(sr.current.values).forEach(function (k) { R0.current.values[k] = String(sr.current.values[k] == null ? '' : sr.current.values[k]); });
            if (typeof sr.current.notes === 'string') R0.current.notes = sr.current.notes;
          }
          if (Array.isArray(sr.history)) R0.history = sr.history.filter(function (h) { return h && typeof h === 'object' && typeof h.label === 'string'; }).map(function (h) {
            var vals = {}, names = {}, kinds = {};
            if (h.values && typeof h.values === 'object') Object.keys(h.values).forEach(function (k) { vals[k] = Number(h.values[k]) || 0; names[k] = h.names && typeof h.names[k] === 'string' ? h.names[k] : 'Tracked'; kinds[k] = h.kinds && h.kinds[k] === 'money' ? 'money' : 'count'; });
            return { label: h.label, start: String(h.start || ''), values: vals, names: names, kinds: kinds, days: h.days == null ? null : Number(h.days) || 0, notes: typeof h.notes === 'string' ? h.notes : '' };
          });
        }
        if (Array.isArray(saved.library)) state.library = saved.library.filter(function (x) { return x && typeof x.text === 'string' && x.text.trim(); }).slice(0, 10).map(function (x) { return { title: typeof x.title === 'string' ? x.title : '', text: x.text, week: typeof x.week === 'string' ? x.week : '' }; });
        if (typeof saved.view === 'string') state.view = saved.view;
      }
    }
  } catch (e) { /* start fresh */ }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }
  var saveT;
  function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 400); }

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);

  function parseReply(text) {

      if (cur == null) return;

      if (!out[cur]) out[cur] = { title: '', text: '', img: '', ig: '', fb: '', tt: '' };
      if (kind === 'post') out[cur].text = body;
      else if (kind === 'ig' || kind === 'fb' || kind === 'tt') out[cur][kind] = body;
      else if (kind === 'title') out[cur].title = body.replace(/\s*\n\s*/g, ' ').replace(/^["\u201c]+|["\u201d]+$/g, '');
      else out[cur].img = body;
    }
    lines.forEach(function (raw) {
      var ln = raw.replace(/^[\s#*>_]+/, '').replace(/[\s*_:]+$/, '');
      if (/^```/.test(raw.trim())) return;
      var m = /^(TITLE|POST|IMAGE(?: PROMPT)?|INSTAGRAM|FACEBOOK|TIK ?TOK)\s*(\d{1,2})\b(?:\s*[:.)\-|].*)?$/i.exec(ln);
      if (m) {
        flush(); cur = Number(m[2]); buf = [];
        var lab = m[1].toLowerCase().replace(' ', '');
        kind = lab === 'post' ? 'post' : lab === 'title' ? 'title' : lab === 'instagram' ? 'ig' : lab === 'facebook' ? 'fb' : lab === 'tiktok' ? 'tt' : 'img';
        return;
      }
      if (cur != null) buf.push(raw);
    });
    flush();
    return out;
  }

            compressImage(file.files && file.files[0], function (url) {
              var prev = s.img; s.img = url;
              if (!save()) { s.img = prev; toast('Your planner is full. Remove a few images and try again.'); return; }
              toast('Image added to ' + DAYS[it.day] + '.'); renderKeep();
            });
          });
          right.appendChild(el('span', { class: 'btn small main filebtn' }, ['+ Add image', file]));
        }
        return el('div', { class: 'imgrow' }, [
          el('div', { class: 'imgtext' }, [
            el('div', { class: 't', text: DAYS[it.day] + (it.sl.second ? ', second post' : '') }),
            p(s.title || 'Post ' + (it.idx + 1), 'hint'),
            el('div', { class: 'actions' }, [
              el('button', { type: 'button', class: 'btn small', text: 'Copy image prompt', onclick: function () { copyText(s.imgPrompt, 'Image prompt copied. Paste it into ChatGPT.'); } })
            ])
          ]),
          right
        ]);
      });
      box.appendChild(el('section', { class: 'card', 'aria-label': 'Make your images' }, [
        el('h3', { text: 'Step 3: Make your images' }),
        p(made + ' of ' + withPrompts.length + ' images added', 'lead'),
        el('ol', { class: 'steps' }, [
          el('li', {}, [el('span', { class: 'st', text: 'Copy the image prompt' }), 'Tap Copy image prompt on a post. Have a photo of you or your product handy if you want to use one.']),
          el('li', {}, [el('span', { class: 'st', text: 'Make it in ChatGPT' }), 'Paste it into ChatGPT. It asks if you want to add your photo first. Then download the banner it makes. If the words come out wrong, ask it to fix the spelling.']),
          el('li', {}, [el('span', { class: 'st', text: 'Upload it here' }), 'Tap + Add image on the same post. It shows up on that day in My promo week.'])
        ]),
        el('div', { class: 'actions' }, [el('a', { class: 'btn small', href: 'https://chatgpt.com/', target: '_blank', rel: 'noopener noreferrer', text: 'Open ChatGPT' })]),
        el('div', {}, rows),
        made === withPrompts.length ? el('div', { class: 'callout' }, [el('strong', { text: 'All set. ' }), 'Your posts and images are ready to go.', el('div', { class: 'actions' }, [el('button', { type: 'button', class: 'btn main small', text: 'See my promo week', onclick: function () { setView('week'); } })])]) : null
      ]));
    }
  }


  /* ---------- placeholders ---------- */
  function renderSoon(v) {
    var box = $('view'); box.innerHTML = '';
    var cur = VIEWS.filter(function (x) { return x.id === v; })[0];
    box.appendChild(el('h1', { text: cur.label }));
    box.appendChild(el('section', { class: 'card soon-card' }, [
      el('div', { class: 'glyph', 'aria-hidden': 'true', text: '\u2726' }),
      p('This part is being built. Check back soon.', 'hint')
    ]));
  }

  /* ---------- start ---------- */
  $('backupLink').addEventListener('click', function (e) { e.preventDefault(); setView('start'); setTimeout(function () { var c = document.querySelector('[aria-label="Back up your planner"]'); if (c) c.scrollIntoView({ behavior: 'smooth' }); }, 60); });
  var valid = VIEWS.map(function (v) { return v.id; });
  if (valid.indexOf(state.view) === -1 && !/^day[0-6]$/.test(state.view) && !/^guide-(voice|gates|profile|clients|every)$/.test(state.view)) state.view = 'start';
  if (!state.design.done && /^guide/.test(state.view)) state.view = 'start';
  var hv = viewFromHash(location.hash);
  if (hv && !(/^guide/.test(hv) && !state.design.done)) state.view = hv;
  setView(state.view);
})();
</script>
</body>
</html>
